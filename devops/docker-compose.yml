services:
  api-gateway:
    build: ../backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - AUTH_SERVICE_URI=http://auth-service:8081
      - RESTAURANT_SERVICE_URI=http://restaurant-service:8082
      - GUESTHOUSE_SERVICE_URI=http://guesthouse-service:8083
      - MARKETPLACE_SERVICE_URI=http://marketplace-service:8084
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}

    depends_on:
      - redis
    networks:
      - platform-network

  auth-service:
    build: ../backend/auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/authdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-platformuser}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-platformpass}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      - db
    networks:
      - platform-network

  restaurant-service:
    build: ../backend/restaurant-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/restaurantdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-platformuser}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-platformpass}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}


    depends_on:
      - db
    networks:
      - platform-network

  guesthouse-service:
    build: ../backend/guesthouse-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/guesthousedb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-platformuser}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-platformpass}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      - db
    networks:
      - platform-network

  marketplace-service:
    build: ../backend/marketplace-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/marketplacedb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-platformuser}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-platformpass}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}

    depends_on:
      - db
    networks:
      - platform-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USERNAME:-platformuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-platformpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    networks:
      - platform-network

volumes:
  postgres-data:

networks:
  platform-network:
    driver: bridge
