services:
  api-gateway:
    build: ../backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (copy .env.example to .env)}
      - AUTH_SERVICE_URI=http://auth-service:8081
      - RESTAURANT_SERVICE_URI=http://restaurant-service:8082
      - GUESTHOUSE_SERVICE_URI=http://guesthouse-service:8083
      - MARKETPLACE_SERVICE_URI=http://marketplace-service:8084
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      - redis
    networks:
      - platform-network

  auth-service:
    build: ../backend/auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/authdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      database-provisioner:
        condition: service_completed_successfully
    networks:
      - platform-network

  database-provisioner:
    image: postgres:16-alpine
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USERNAME:?DB_USERNAME must be set}
      - PGPASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - PGDATABASE=postgres
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        echo "Creating roles and databases for each service..."
        for dbname in authdb restaurantdb guesthousedb marketplacedb familytreedb; do
          role="${dbname}_app"
          echo "Creating role: $role"
          psql -c "CREATE ROLE $role WITH LOGIN PASSWORD 'changeme';" || echo "Role $role exists"
          
          echo "Creating database: $dbname"
          if psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$dbname'" | grep -q 1; then
            echo "$dbname already exists."
          else
            createdb -O $role $dbname
            echo "Created $dbname owned by $role"
          fi
        done
        
        echo "Running init.sql for extensions and base setup..."
        psql -f /docker-entrypoint-initdb.d/init.sql
        
        echo "Database provisioning completed successfully."
    restart: "no"
    networks:
      - platform-network

  restaurant-service:
    build: ../backend/restaurant-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/restaurantdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      database-provisioner:
        condition: service_completed_successfully
    networks:
      - platform-network

  guesthouse-service:
    build: ../backend/guesthouse-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/guesthousedb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      database-provisioner:
        condition: service_completed_successfully
    networks:
      - platform-network

  marketplace-service:
    build: ../backend/marketplace-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/marketplacedb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
    depends_on:
      database-provisioner:
        condition: service_completed_successfully
    networks:
      - platform-network

  familytree-service:
    build: ../backend/family-tree-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/familytreedb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET must be set}
      - BETA_PASSCODE=${BETA_PASSCODE:-}
    depends_on:
      database-provisioner:
        condition: service_completed_successfully
    networks:
      - platform-network

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - platform-network

volumes:
  postgres-data:

networks:
  platform-network:
    driver: bridge