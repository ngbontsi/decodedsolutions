server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
internal:
  shared-secret: ${INTERNAL_SHARED_SECRET}
