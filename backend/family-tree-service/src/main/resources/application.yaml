spring:
  application:
    name: family-tree-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/familytreedb}
    username: ${DB_USERNAME:platformuser}
    password: ${DB_PASSWORD:platformpass}
    hikari:
      maximum-pool-size: 10
      pool-name: familytree-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:${SERVER_PORT:8085}}
  error:
    include-message: always

beta:
  passcode: ${BETA_PASSCODE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.platform.familytree: INFO
    org.hibernate.SQL: WARN
