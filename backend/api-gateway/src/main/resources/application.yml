server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 10
                  burstCapacity: 20
                  requestedTokens: 1

        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/restaurant/**
          filters:
            - StripPrefix=2

        - id: guesthouse-service
          uri: ${GUESTHOUSE_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/guesthouse/**
          filters:
            - StripPrefix=2

        - id: marketplace-service
          uri: ${MARKETPLACE_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/marketplace/**
          filters:
            - StripPrefix=2

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://ngbontsi.github.io"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
internal:
  shared-secret: ${INTERNAL_SHARED_SECRET}